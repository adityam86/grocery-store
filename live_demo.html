      const [cart, setCart] = useState([]);
      const addToCart = (product) => {
        setCart(prev => {
          const item = prev.find(i => i.product.id === product.id);
          if (item) return prev.map(i => i.product.id === product.id ? { ...i, quantity: Math.min(i.quantity + 1, product.stockQuantity) } : i);
          return [...prev, { product, quantity: 1 }];
        });
      };
      const removeFromCart = (id) => setCart(prev => prev.filter(i => i.product.id !== id));
      const updateQuantity = (id, q) => {
        const item = cart.find(i => i.product.id === id);
        if (!item) return;
        if (q <= 0) return removeFromCart(id);
        setCart(prev => prev.map(i => i.product.id === id ? { ...i, quantity: Math.min(q, i.product.stockQuantity) } : i));
      };
      const clearCart = () => setCart([]);
      const cartCount = cart.reduce((acc, i) => acc + i.quantity, 0);
      const cartTotal = cart.reduce((acc, i) => acc + i.product.price * i.quantity, 0);

      return (
        <CartContext.Provider value={{ cart, addToCart, removeFromCart, updateQuantity, clearCart, cartCount, cartTotal }}>
          {children}

      );

    // --- Checkout Form Component ---
    const CheckoutForm = ({ user, onBack, onOrderSuccess, currentTheme, products, setProducts }) => {
      const { cart, cartTotal, clearCart } = useCart();
      const themeObj = THEMES[currentTheme];
      
      const savedAddresses = user && user.addresses ? user.addresses : [];

      const [formData, setFormData] = useState({ fullName: user ? user.fullName : '', phone: '', address: savedAddresses[0] || '', city: '', pinCode: '', paymentMethod: 'cod' });
      const [loading, setLoading] = useState(false);
      const [successOrder, setPlacedOrder] = useState(null);
      const [showPaymentPortal, setShowPaymentPortal] = useState(false);
      const [showRazorpayModal, setShowRazorpayModal] = useState(false);
      const [razorpayTab, setRazorpayTab] = useState('qr'); // 'qr', 'upi_id', 'nb', 'card'
      const [upiIdInput, setUpiIdInput] = useState('');
      const [mockScanProcessing, setMockScanProcessing] = useState(false);
      const [cardDetails, setCardDetails] = useState({ number: '', expiry: '', cvc: '' });

      // Promo States
      const [promoInput, setPromoInput] = useState('');
      const [appliedPromo, setAppliedPromo] = useState('');
      const [promoError, setPromoError] = useState('');
      const [discountAmount, setDiscountAmount] = useState(0);

      const currentShipping = (cartTotal >= 500 || appliedPromo === 'FREESHIP') ? 0 : 49;
      const currentTotal = Math.max(0, cartTotal + currentShipping - discountAmount);

      const handleApplyPromo = () => {
        setPromoError('');
        const code = promoInput.trim().toUpperCase();
        if (code === 'WELCOME10') {
          setAppliedPromo(code);
          setDiscountAmount(Math.round(cartTotal * 0.10));
        } else if (code === 'FREESHIP') {
          setAppliedPromo(code);
          setDiscountAmount(0);
        } else if (code === 'DIWALI20') {
          setAppliedPromo(code);
          setDiscountAmount(Math.round(cartTotal * 0.20));
        } else {
          setPromoError('Invalid promo code');
        }
      };

      const handleRemovePromo = () => {
        setAppliedPromo('');
        setDiscountAmount(0);
        setPromoInput('');
        setPromoError('');
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (formData.paymentMethod === 'card') {
          setShowPaymentPortal(true);
        } else if (formData.paymentMethod === 'upi') {
          setShowRazorpayModal(true);
        } else {
          executeCheckoutProcess();
        }
      };

      const executeCheckoutProcess = () => {
        setLoading(true);
        setTimeout(() => {
          // Decrement mock stock counts
          const updatedProducts = products.map(p => {
            const purchased = cart.find(it => it.product.id === p.id);
            if (purchased) {
              const nextQty = Math.max(0, p.stockQuantity - purchased.quantity);
              return { ...p, stockQuantity: nextQty };
            }
            return p;
          });
          setProducts(updatedProducts);
          localStorage.setItem('apna_bazar_simulated_products', JSON.stringify(updatedProducts));

          const currentShipping = (cartTotal >= 500 || appliedPromo === 'FREESHIP') ? 0 : 49;
          const currentTotal = Math.max(0, cartTotal + currentShipping - discountAmount);

          const order = {
            orderId: `AB-${Math.floor(100000 + Math.random() * 900000)}`,
            userId: user ? user.id : 'guest',
            items: cart.map(i => ({ name: i.product.name, price: i.product.price, quantity: i.quantity, unit: i.product.unit, id: i.product.id })),
            deliveryDetails: { fullName: formData.fullName, phone: formData.phone, address: formData.address, pinCode: formData.pinCode },
            subtotal: cartTotal,
            shipping: currentShipping,
            discountAmount: discountAmount,
            promoCode: appliedPromo || '',
            total: currentTotal,
            status: 'Placed',

                    {/* Standalone All Products Button */}
                    <button
                      onClick={() => setSelectedCategory('all')}
                      className={`flex flex-col justify-center items-center text-center p-5 rounded-[24px] border transition-all cursor-pointer active:scale-95 shadow-sm ${
                        selectedCategory === 'all'
                          ? (currentTheme === 'midnight' 
                              ? 'bg-curry-500 border-curry-500 text-neutral-950 shadow-md shadow-curry-500/10' 
                              : 'bg-neutral-900 border-neutral-900 text-white shadow-md')
                          : (currentTheme === 'midnight'
                              ? 'bg-neutral-900 border-neutral-800 text-neutral-300 hover:bg-neutral-800/80 hover:text-white'
                              : 'bg-white border-neutral-200 text-neutral-600 hover:bg-neutral-50 hover:text-neutral-800')
                      }`}
                    >
                      <span className="text-2xl mb-2">✨</span>
                      <span className="text-xs font-bold uppercase tracking-wider block">All Products</span>
                      <span className="text-[9px] text-neutral-400 font-medium block mt-1">पूरे उत्पाद • Catalog View</span>
                    </button>

                    {[
                      {
                        groupName: 'Pantry Essentials',
                        hindiGroup: 'रसोई सामग्री',
                        categories: [
                          { id: 'staples', name: 'Staples & Grains', label: '🌾', subtitle: 'Atta, Rice, Dals' },
                          { id: 'spices', name: 'Spices & Masalas', label: '🌶️', subtitle: 'Garam Masala, Haldi' }
                        ]
                      },
                      {
                        groupName: 'Fresh & Chilled',
                        hindiGroup: 'ताज़ा उत्पाद',
                        categories: [
                          { id: 'dairy', name: 'Fresh & Dairy', label: '🥛', subtitle: 'Paneer, Dahi, Ghee' }
                        ]
                      },
                      {
                        groupName: 'Snacks & Drinks',
                        hindiGroup: 'चाय और नाश्ता',
                        categories: [
                          { id: 'snacks', name: 'Sweets & Snacks', label: '🍪', subtitle: 'Aloo Bhujia, Biscuits' },
                          { id: 'beverages', name: 'Beverages', label: '☕', subtitle: 'Chai Leaf, Coffee' }
                        ]
                      }
                    ].map((group, gIdx) => (
                      <div 
                        key={gIdx} 
                        className={`col-span-1 border rounded-[24px] p-4 flex flex-col gap-3 transition-colors duration-500 ${
                          currentTheme === 'midnight' ? 'bg-neutral-900/40 border-neutral-800' : 'bg-neutral-50/50 border-neutral-200'
                        }`}
                      >
                        <div className="flex justify-between items-baseline border-b border-neutral-200/40 dark:border-neutral-800/60 pb-1.5 px-1">
                          <span className="text-[10px] font-black uppercase tracking-wider text-neutral-450">{group.groupName}</span>
                          <span className="text-[9px] font-bold text-neutral-400">{group.hindiGroup}</span>
                        </div>

                        <div className="grid grid-cols-1 gap-2 flex-grow">
                          {group.categories.map((cat) => {
                            const isActive = selectedCategory === cat.id;
                            return (
                              <button
                                key={cat.id}
                                onClick={() => setSelectedCategory(cat.id)}
                                className={`flex items-center gap-3 px-4 py-2.5 rounded-xl border text-left cursor-pointer transition-all active:scale-97 ${
                                  isActive
                                    ? (currentTheme === 'midnight' 
                                        ? 'bg-curry-500 border-curry-500 text-neutral-950 font-black shadow shadow-curry-500/10' 
                                        : 'bg-neutral-900 border-neutral-900 text-white font-black shadow')
                                    : (currentTheme === 'midnight'
                                        ? 'bg-neutral-900 border-neutral-800 text-neutral-300 hover:bg-neutral-800 hover:text-white'
                                        : 'bg-white border-neutral-200 text-neutral-600 hover:bg-neutral-50 hover:text-neutral-800')
                                }`}
                              >
                                <span className="text-base shrink-0">{cat.label}</span>
                                <div className="min-w-0">
                                  <span className="text-xs font-bold block truncate">{cat.name}</span>
                                  <span className="text-[8px] text-neutral-450 font-medium block truncate mt-0.5">{cat.subtitle}</span>
                                </div>
                              </button>
                            );
                          })}
                        </div>
                      </div>
                    ))}
                  </div>

                  {/* Grid items */}
                  <div>
                    <div className="flex justify-between items-center mb-6 text-xs text-neutral-400">
                      <span className="uppercase font-bold tracking-wider">Catalog Listings</span>
                      <span className="font-semibold">Showing {filteredProducts.length} items</span>
                    </div>

                    {filteredProducts.length === 0 ? (
                      <div className={`text-center py-16 rounded-3xl border p-8 max-w-sm mx-auto ${currentTheme === 'midnight' ? 'bg-neutral-900 border-neutral-800' : 'bg-white border-neutral-100'}`}>
                        <Icon name="info" className="w-12 h-12 text-neutral-450 mx-auto mb-4" />
                        <p className="text-sm font-bold text-neutral-400">No products found. Adjust filters.</p>
                      </div>
                    ) : (
                      <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 animate-fade-in">
                        {filteredProducts.map(p => (
                          <div 
                            key={p.id} 
                            className={`transition-colors duration-500 rounded-3xl ${currentTheme === 'midnight' ? 'bg-neutral-900 border border-neutral-800 text-white' : 'bg-white'}`}
                          >
                            <ProductCard 
                              product={p} 
                              currentTheme={currentTheme} 
                              wishlist={wishlist}
                              onToggleWishlist={handleToggleWishlist}
                              onSelectProduct={setSelectedProduct}
                            />
                          </div>
                        ))}
                      </div>
                    )}
                  </div>

                  {/* Recommendations */}
                  {recommendedItems.length > 0 && selectedCategory === 'all' && (
                    <div className="mt-16 border-t border-neutral-200 dark:border-neutral-800/80 pt-12">
                      <h3 className="text-base font-extrabold tracking-tight mb-2 flex items-center gap-1.5">
                        <Icon name="heart" className="w-4 h-4 text-red-500 fill-red-500" /> Recommended For You
                      </h3>
                      <p className="text-xs text-neutral-400 mb-6 font-semibold">Bestselling items in high demand</p>
                      <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-6">
                        {recommendedItems.map(p => (
                          <div 
                            key={`rec-${p.id}`}
                            className={`transition-colors duration-500 rounded-3xl ${currentTheme === 'midnight' ? 'bg-neutral-900 border border-neutral-800 text-white' : 'bg-white'}`}
                          >
                            <ProductCard 
                              product={p} 
                              currentTheme={currentTheme} 
                              wishlist={wishlist}
                              onToggleWishlist={handleToggleWishlist}
                              onSelectProduct={setSelectedProduct}
                            />
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                </section>
              </>
            )}
          </main>

          {/* Cart Sidebar Drawer */}
          <CartModal 
            isOpen={isCartOpen} 
            onClose={() => setIsCartOpen(false)} 
            onCheckout={() => { 
              setIsCartOpen(false); 
              if (user) {
                setActivePage('checkout');
              } else {
                setIsAuthOpen(true);
              }
            }} 
            currentTheme={currentTheme} 
            products={products}
          />

          {/* Auth Popup */}
          <AuthModal isOpen={isAuthOpen} onClose={() => setIsAuthOpen(false)} onAuthSuccess={handleAuthSuccess} currentTheme={currentTheme} />

          {/* Product Detail Modal */}
          {selectedProduct && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 select-none">
              <div className="absolute inset-0 bg-neutral-950/60 backdrop-blur-sm" onClick={() => setSelectedProduct(null)}></div>
              
              <div className={`relative w-full max-w-2xl rounded-3xl overflow-hidden border shadow-2xl transition-all duration-300 flex flex-col max-h-[85vh] ${
                currentTheme === 'midnight' ? 'bg-neutral-900 border-neutral-800 text-white' : 'bg-white border-neutral-100 text-neutral-800'
              }`}>
                <button onClick={() => setSelectedProduct(null)} className="absolute top-4 right-4 z-10 p-1.5 rounded-full text-neutral-400 hover:bg-neutral-500/10 cursor-pointer border-none bg-transparent">
                  <Icon name="x" className="w-5 h-5" />
                </button>

                <div className="overflow-y-auto p-6 space-y-6">
                  <div className="grid grid-cols-1 md:grid-cols-12 gap-6 items-start">
                    <div className="md:col-span-5 flex flex-col items-center">
                      <div className={`w-full aspect-square rounded-[24px] flex items-center justify-center text-5xl border ${
                        currentTheme === 'midnight' ? 'bg-neutral-950/40 border-neutral-800' : 'bg-neutral-50 border-neutral-100'
                      }`}>
                        {selectedProduct.category === 'staples' ? '🌾' : selectedProduct.category === 'spices' ? '🌶️' : selectedProduct.category === 'dairy' ? '🥛' : selectedProduct.category === 'beverages' ? '☕' : '🍪'}
                      </div>
                      <span className="text-[9px] uppercase font-bold text-neutral-400 mt-2 block">
                        Category: {selectedProduct.category}
                      </span>
                    </div>

                    <div className="md:col-span-7 space-y-3 text-left">
                      <h2 className="text-lg font-black">{selectedProduct.name}</h2>
                      {selectedProduct.hindiName && <p className="text-xs font-bold text-neutral-400">{selectedProduct.hindiName}</p>}
                      
                      <div className="flex items-center gap-1">
                        <Icon name="star" className="w-3.5 h-3.5 fill-amber-450 text-amber-450" />
                        <span className="text-xs font-black">{selectedProduct.rating || 5.0}</span>
                        <span className="text-xs text-neutral-400 font-semibold">({selectedProduct.reviewsCount || 0} reviews)</span>
                      </div>

                      <p className="text-xs text-neutral-405 leading-relaxed font-semibold">{selectedProduct.description}</p>
                      
                      <div className="flex items-baseline gap-1">
                        <span className="text-xl font-black">₹{selectedProduct.price}</span>
                        <span className="text-[10px] text-neutral-405 uppercase tracking-wider font-bold">/ {selectedProduct.unit}</span>
                      </div>

                      <button
                        onClick={() => {
                          addToCart(selectedProduct);
                        }}
                        className={`w-full py-2.5 rounded-full font-bold text-xs text-white transition-all cursor-pointer border-none shadow active:scale-95 ${themeObj.primary}`}
                      >
                        🛒 Add to Cart
                      </button>
                    </div>
                  </div>

                  <hr className="border-neutral-100 dark:border-neutral-800/60" />

                  {/* Reviews */}
                  <div className="space-y-4 text-left">
                    <h3 className="font-extrabold text-xs uppercase tracking-wider">Customer Reviews</h3>
                    <div className="space-y-2 max-h-44 overflow-y-auto pr-1">
                      {!(selectedProduct.reviews) || selectedProduct.reviews.length === 0 ? (
                        <p className="text-xs text-neutral-400 italic">No reviews yet. Be the first!</p>
                      ) : (
                        selectedProduct.reviews.map((r, idx) => (
                          <div key={idx} className={`p-3 rounded-xl border text-xs space-y-1 ${
                            currentTheme === 'midnight' ? 'bg-neutral-950/40 border-neutral-850' : 'bg-neutral-50/50 border-neutral-150'
                          }`}>
                            <div className="flex justify-between items-center font-bold">
                              <span>👤 {r.userName}</span>
                              <span className="text-[9px] text-neutral-400 font-semibold">{new Date(r.createdAt).toLocaleDateString()}</span>
                            </div>
                            <div className="flex text-amber-450 gap-0.5">
                              {[...Array(Math.round(r.rating || 5))].map((_, i) => (
                                <Icon key={i} name="star" className="w-3 h-3 fill-amber-450 text-amber-450" />
                              ))}
                            </div>
                            <p className="text-neutral-450 leading-relaxed font-semibold">{r.comment}</p>
                          </div>
                        ))
                      )}
                    </div>

                    {/* Add Review */}
                    <div className={`p-3 rounded-xl border ${
                      currentTheme === 'midnight' ? 'bg-neutral-900 border-neutral-800' : 'bg-neutral-50 border-neutral-150'
                    }`}>
                      <h4 className="font-bold text-[10px] uppercase tracking-wider mb-2">Write Review</h4>
                      {user ? (
                        <form onSubmit={(e) => {
                          e.preventDefault();
                          if (!reviewComment.trim()) return;
                          
                          const newReview = {
                            userId: user.id,
                            userName: user.fullName,
                            rating: reviewRating,
                            comment: reviewComment,
                            createdAt: new Date().toISOString()
                          };

                          const updatedProduct = { ...selectedProduct };
                          if (!updatedProduct.reviews) updatedProduct.reviews = [];
                          updatedProduct.reviews.push(newReview);
                          updatedProduct.reviewsCount = updatedProduct.reviews.length;
                          const totalRating = updatedProduct.reviews.reduce((acc, item) => item.rating + acc, 0);
                          updatedProduct.rating = Number((totalRating / updatedProduct.reviews.length).toFixed(1));

                          // Sync back to local storage products
                          const updatedProducts = products.map(p => p.id === selectedProduct.id ? updatedProduct : p);
                          setProducts(updatedProducts);
                          localStorage.setItem('apna_bazar_simulated_products', JSON.stringify(updatedProducts));
                          
                          setSelectedProduct(updatedProduct);
                          setReviewComment('');
                          setReviewRating(5);
                        }} className="space-y-2">
                          <div className="flex items-center gap-1.5">
                            <span className="text-[10px] text-neutral-405 font-bold">Rating:</span>
                            <div className="flex text-amber-450 cursor-pointer">
                              {[1, 2, 3, 4, 5].map((s) => (
                                <span key={s} onClick={() => setReviewRating(s)} className="text-sm">
                                  {s <= reviewRating ? '★' : '☆'}
                                </span>
                              ))}
                            </div>
                          </div>
                          <input 
                            required
                            type="text"
                            placeholder="Comment..."
                            value={reviewComment}
                            onChange={e => setReviewComment(e.target.value)}
                            className={`w-full px-3 py-1.5 border rounded-xl text-xs bg-neutral-950/20 ${
                              currentTheme === 'midnight' ? 'border-neutral-800 text-white' : 'border-neutral-200 text-neutral-800'
                            }`}
                          />
                          <button type="submit" className={`px-3 py-1 text-[9px] font-bold text-white rounded-full ${themeObj.primary}`}>
                            Submit
                          </button>
                        </form>
                      ) : (
                        <p className="text-[10px] text-neutral-400 italic">Please log in to submit a review.</p>
                      )}
                    </div>

                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className={`w-full py-10 px-4 md:px-8 border-t text-xs transition-colors duration-500 ${
            currentTheme === 'midnight' ? 'bg-neutral-950 text-neutral-500 border-neutral-900' : 'bg-neutral-900 text-neutral-400 border-neutral-800'
          }`}>
            <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
              <span>&copy; Apna Bazar Groceries. Live Interactive Demo.</span>
              <div className="flex gap-4">
                <a href="#">Terms of Service</a>
                <a href="#">Privacy Policy</a>
              </div>
            </div>
          </footer>

        </div>
      );
    };

    // --- Bootstrapping React ---
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <CartProvider>
        <StoreApp />
      </CartProvider>
    );
  </script>

</body>
</html>
